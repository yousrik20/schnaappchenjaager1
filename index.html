                        </button>
                    </div>
                </div>
            );
        }

        // Blog Detail Page
        function BlogDetailPage({ slug, onBack }) {
            const post = blogPosts.find(p => p.slug === slug);
            
            if (!post) {
                return (
                    <div className="min-h-screen bg-gray-50">
                        <nav className="sticky top-0 z-50 bg-white border-b border-gray-200">
                            <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                                <button 
                                    onClick={onBack}
                                    className="text-indigo-600 hover:text-indigo-700 font-medium cursor-pointer"
                                >
                                    ← Zurück
                                </button>
                            </div>
                        </nav>
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                            <p className="text-gray-500">Artikel nicht gefunden.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <nav className="sticky top-0 z-50 bg-white border-b border-gray-200">
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
                            <button 
                                onClick={onBack}
                                className="text-indigo-600 hover:text-indigo-700 font-medium cursor-pointer"
                            >
                                ← Zurück zur Startseite
                            </button>
                            <h1 className="text-2xl font-bold gradient-text">
                                schnäppchenjäger1
                            </h1>
                            <div></div>
                        </div>
                    </nav>

                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                        <article>
                            <div className="mb-8">
                                <div className="flex items-center gap-4 mb-4">
                                    <span className="text-4xl">{post.emoji}</span>
                                    <div>
                                        <p className="text-sm text-indigo-600 font-semibold">
                                            {new Date(post.date).toLocaleDateString('de-DE', { year: 'numeric', month: 'long', day: 'numeric' })}
                                        </p>
                                        <p className="text-sm text-gray-500">Von {post.author}</p>
                                    </div>
                                </div>
                                <h1 className="text-4xl sm:text-5xl font-bold text-gray-900 mb-4 leading-tight">{post.title}</h1>
                                <p className="text-xl text-gray-600">{post.excerpt}</p>
                            </div>

                            <div className="bg-white rounded-lg p-8 shadow-sm border border-gray-100 blog-content">
                                <div dangerouslySetInnerHTML={{ __html: post.content }} />
                            </div>

                            <div className="mt-12 p-6 bg-indigo-50 rounded-lg border border-indigo-200">
                                <h3 className="font-semibold text-gray-900 mb-2">Über den Autor</h3>
                                <p className="text-gray-700">{post.author} ist ein Experte für Schnäppchen und Online-Shopping bei schnäppchenjäger1.</p>
                            </div>
                        </article>
                    </div>

                    <footer className="bg-gray-900 text-gray-300 mt-16">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                            <p className="text-sm text-center text-gray-400">
                                © 2026 schnäppchenjäger1 GmbH. Alle Rechte vorbehalten.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        // Impressum
        function Impressum() {
            return (
                <div className="min-h-screen bg-white">
                    <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                        <h1 className="text-3xl font-bold text-gray-900 mb-8">Impressum</h1>
                        <div className="space-y-8 text-gray-700 leading-relaxed">
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">Angaben gemäß § 5 TMG</h2>
                                <p>schnäppchenjäger1 GmbH<br />Eckenbergstraße 11<br />45307 Essen<br />Deutschland</p>
                            </div>
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">Kontakt</h2>
                                <p>E-Mail: <a href="mailto:info@schnäppchenjäger1.de" className="text-indigo-600">info@schnäppchenjäger1.de</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Datenschutz
        function Datenschutz() {
            return (
                <div className="min-h-screen bg-white">
                    <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                        <h1 className="text-3xl font-bold text-gray-900 mb-8">Datenschutzerklärung</h1>
                        <p className="text-gray-700">Diese Website ist DSGVO-konform.</p>
                    </div>
                </div>
            );
        }

        // Main App
        function App() {
            const [currentPage, setCurrentPage] = useState('home');
            const [blogSlug, setBlogSlug] = useState(null);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Alle');
            const [favorites, setFavorites] = useState(new Set());
            const [email, setEmail] = useState('');
            const [subscribed, setSubscribed] = useState(false);
            const [showTopDeals, setShowTopDeals] = useState(false);

            const categories = ['Alle', 'Mode', 'Elektronik', 'Möbel', 'Reisen', 'Sport', 'Beauty'];

            let filteredDeals = dealsData.filter(deal => {
                const matchesSearch = deal.brandName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                     deal.description.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = selectedCategory === 'Alle' || deal.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            if (showTopDeals) {
                filteredDeals = filteredDeals.sort((a, b) => {
                    const aValue = parseInt(a.discountValue) || 0;
                    const bValue = parseInt(b.discountValue) || 0;
                    return bValue - aValue;
                }).slice(0, 8);
            }

            const handleFavorite = (id) => {
                const newFavorites = new Set(favorites);
                if (newFavorites.has(id)) {
                    newFavorites.delete(id);
                } else {
                    newFavorites.add(id);
                }
                setFavorites(newFavorites);
            };

            const handleNewsletterSubmit = (e) => {
                e.preventDefault();
                if (email) {
                    setSubscribed(true);
                    setEmail('');
                    setTimeout(() => setSubscribed(false), 3000);
                }
            };

            const handleBlogClick = (slug) => {
                setBlogSlug(slug);
                window.scrollTo(0, 0);
            };

            if (blogSlug) {
                return <BlogDetailPage slug={blogSlug} onBack={() => setBlogSlug(null)} />;
            }

            if (currentPage === 'impressum') {
                return (
                    <>
                        <nav className="sticky top-0 z-50 bg-white border-b border-gray-200">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                                <button onClick={() => setCurrentPage('home')} className="text-2xl font-bold gradient-text cursor-pointer">
                                    schnäppchenjäger1
                                </button>
                            </div>
                        </nav>
                        <Impressum />
                    </>
                );
            }

            if (currentPage === 'datenschutz') {
                return (
                    <>
                        <nav className="sticky top-0 z-50 bg-white border-b border-gray-200">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                                <button onClick={() => setCurrentPage('home')} className="text-2xl font-bold gradient-text cursor-pointer">
                                    schnäppchenjäger1
                                </button>
                            </div>
                        </nav>
                        <Datenschutz />
                    </>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Navigation */}
                    <nav className="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <h1 className="text-2xl font-bold gradient-text">
                                    schnäppchenjäger1
                                </h1>

                                <div className="hidden md:flex items-center gap-8">
                                    <button 
                                        onClick={() => {
                                            setShowTopDeals(false);
                                            setSelectedCategory('Alle');
                                            document.getElementById('categories-section')?.scrollIntoView({ behavior: 'smooth' });
                                        }}
                                        className="category-button text-gray-700 hover:text-indigo-600 font-medium text-sm transition-colors cursor-pointer flex items-center"
                                    >
                                        <span className="category-icon text-indigo-600">
                                            <CategoryIcon type="Alle" />
                                        </span>
                                        Kategorien
                                    </button>
                                    <button 
                                        onClick={() => setShowTopDeals(!showTopDeals)}
                                        className={`font-medium text-sm transition-colors cursor-pointer ${showTopDeals ? 'text-indigo-600' : 'text-gray-700 hover:text-indigo-600'}`}
                                    >
                                        🔥 Top-Deals
                                    </button>
                                    <button 
                                        onClick={() => document.getElementById('blog-section')?.scrollIntoView({ behavior: 'smooth' })}
                                        className="text-gray-700 hover:text-indigo-600 font-medium text-sm transition-colors cursor-pointer"
                                    >
                                        📖 Blog
                                    </button>
                                </div>

                                <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="md:hidden text-gray-700 cursor-pointer text-xl">
                                    {mobileMenuOpen ? '✕' : '☰'}
                                </button>
                            </div>

                            {mobileMenuOpen && (
                                <div className="md:hidden py-4 border-t border-gray-100">
                                    <button 
                                        onClick={() => {
                                            setShowTopDeals(false);
                                            setSelectedCategory('Alle');
                                            setMobileMenuOpen(false);
                                            document.getElementById('categories-section')?.scrollIntoView({ behavior: 'smooth' });
                                        }}
                                        className="block w-full text-left px-4 py-2 text-gray-700 hover:text-indigo-600 font-medium cursor-pointer"
                                    >
                                        Kategorien
                                    </button>
                                    <button 
                                        onClick={() => {
                                            setShowTopDeals(!showTopDeals);
                                            setMobileMenuOpen(false);
                                        }}
                                        className="block w-full text-left px-4 py-2 text-gray-700 hover:text-indigo-600 font-medium cursor-pointer"
                                    >
                                        🔥 Top-Deals
                                    </button>
                                    <button 
                                        onClick={() => {
                                            setMobileMenuOpen(false);
                                            document.getElementById('blog-section')?.scrollIntoView({ behavior: 'smooth' });
                                        }}
                                        className="block w-full text-left px-4 py-2 text-gray-700 hover:text-indigo-600 font-medium cursor-pointer"
                                    >
                                        📖 Blog
                                    </button>
                                </div>
                            )}
                        </div>
                    </nav>

                    {/* HERO SECTION - UPGRADED WITH ANIMATIONS */}
                    <div className="hero-animated text-white py-16 sm:py-24 relative">
                        {/* Floating decorations */}
                        <div className="floating-decoration" style={{top: '10%', left: '5%', animationDelay: '0s'}}>💰</div>
                        <div className="floating-decoration" style={{top: '20%', right: '10%', animationDelay: '1s'}}>🎁</div>
                        <div className="floating-decoration" style={{bottom: '15%', left: '15%', animationDelay: '2s'}}>⭐</div>

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <h2 className="text-4xl sm:text-5xl font-bold mb-4 leading-tight">
                                Die besten Gutscheine und Rabatte in Deutschland
                            </h2>
                            <p className="text-lg text-indigo-100 mb-8 max-w-2xl">
                                Entdecke täglich neue Deals und Gutscheine von deinen liebsten Marken und sparen Sie mit uns Geld!
                            </p>

                            <div className="relative max-w-md">
                                <input
                                    type="text"
                                    placeholder="Nach Marke oder Deal suchen..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="search-box-glow w-full pl-12 pr-4 py-3 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-white"
                                />
                                <span className="absolute left-4 top-3.5 text-indigo-200">🔍</span>
                            </div>
                        </div>
                    </div>

                    {/* Filter Categories with Custom Icons */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" id="categories-section">
                        <div className="flex items-center justify-between mb-6">
                            <h3 className="text-lg font-bold text-gray-900">Filter nach Kategorie</h3>
                            {showTopDeals && (
                                <button
                                    onClick={() => setShowTopDeals(false)}
                                    className="text-sm text-indigo-600 hover:text-indigo-700 font-medium underline cursor-pointer"
                                >
                                    ✕ Top-Deals Filter entfernen
                                </button>
                            )}
                        </div>
                        <div className="flex overflow-x-auto gap-3 pb-4">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setSelectedCategory(cat)}
                                    className={`category-button px-4 py-2 rounded-full font-medium whitespace-nowrap transition-all duration-200 cursor-pointer flex items-center gap-2 ${
                                        selectedCategory === cat
                                            ? 'bg-indigo-600 text-white shadow-md'
                                            : 'bg-white text-gray-700 border border-gray-200 hover:border-indigo-300'
                                    }`}
                                >
                                    <span className={`category-icon ${selectedCategory === cat ? 'text-white' : 'text-indigo-600'}`} style={{width: '20px', height: '20px'}}>
                                        <CategoryIcon type={cat} />
                                    </span>
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
                        {/* Deals Grid */}
                        <div className="mb-16">
                            <h3 className="text-2xl font-bold text-gray-900 mb-8">
                                {showTopDeals ? '🔥 Top-Deals' : selectedCategory === 'Alle' ? 'Alle Deals' : `${selectedCategory}-Deals`}
                                <span className="text-gray-500 text-lg ml-2">({filteredDeals.length})</span>
                            </h3>

                            {filteredDeals.length > 0 ? (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                    {filteredDeals.map(deal => (
                                        <DealCard
                                            key={deal.id}
                                            deal={deal}
                                            onFavorite={handleFavorite}
                                            isFavorite={favorites.has(deal.id)}
                                        />
                                    ))}
                                </div>
                            ) : (
                                <div className="text-center py-12">
                                    <p className="text-gray-500 text-lg">Keine Deals gefunden. Versuchen Sie eine andere Suche.</p>
                                </div>
                            )}
                        </div>

                        {/* Blog Section */}
                        <div className="mb-16" id="blog-section">
                            <h3 className="text-2xl font-bold text-gray-900 mb-8">📖 Blog & Guides</h3>
                            <p className="text-gray-600 mb-8 max-w-2xl">
                                Entdecken Sie hilfreiche Tipps und Ratgeber, um noch mehr bei Ihrem Shopping zu sparen.
                            </p>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {blogPosts.map(post => (
                                    <BlogCard 
                                        key={post.id} 
                                        post={post}
                                        onBlogClick={handleBlogClick}
                                    />
                                ))}
                            </div>
                        </div>

                        {/* Newsletter */}
                        <div className="bg-gradient-to-r from-indigo-50 to-blue-50 rounded-xl p-8 sm:p-12 border border-indigo-100 mb-16">
                            <h3 className="text-2xl sm:text-3xl font-bold text-gray-900 mb-3">Bleiben Sie informiert!</h3>
                            <p className="text-gray-700 mb-6 max-w-2xl">
                                Abonnieren Sie unseren Newsletter und erhalten Sie täglich die besten Gutscheine und Rabatte.
                            </p>

                            <form onSubmit={handleNewsletterSubmit} className="flex gap-3 max-w-md">
                                <input
                                    type="email"
                                    placeholder="Ihre E-Mail-Adresse"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                    className="flex-1 px-4 py-3 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-600"
                                />
                                <button
                                    type="submit"
                                    className="deal-button px-6 py-3 bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-semibold rounded-lg cursor-pointer"
                                >
                                    Abonnieren
                                </button>
                            </form>

                            {subscribed && (
                                <p className="mt-3 text-green-700 font-medium">✓ Danke für Ihre Anmeldung!</p>
                            )}
                        </div>
                    </div>

                    {/* Footer */}
                    <footer className="bg-gray-900 text-gray-300 mt-16">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-8 mb-8">
                                <div>
                                    <h4 className="text-white font-bold text-lg mb-4">schnäppchenjäger1</h4>
                                    <p className="text-sm">
                                        Die beste Anlaufstelle für Gutscheine, Rabatte und Deals in Deutschland.
                                    </p>
                                </div>
                                <div>
                                    <h4 className="text-white font-bold text-lg mb-4">Links</h4>
                                    <button
                                        onClick={() => setCurrentPage('impressum')}
                                        className="block text-sm hover:text-white transition-colors mb-2 cursor-pointer"
                                    >
                                        Impressum
                                    </button>
                                    <button
                                        onClick={() => setCurrentPage('datenschutz')}
                                        className="block text-sm hover:text-white transition-colors cursor-pointer"
                                    >
                                        Datenschutz
                                    </button>
                                </div>
                            </div>

                            <div className="border-t border-gray-800 pt-8">
                                <p className="text-sm text-center text-gray-400">
                                    © 2026 schnäppchenjäger1 GmbH. Alle Rechte vorbehalten.
                                </p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
