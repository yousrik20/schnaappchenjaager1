                const matchesSearch = deal.brandName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                     deal.description.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = selectedCategory === 'Alle' || deal.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            if (showTopDeals) {
                filteredDeals = filteredDeals.filter(deal => {
                    const discountValue = deal.discountValue;
                    return discountValue === '30%' || discountValue === '€50' || discountValue === '20%' || 
                           discountValue === '25%' || discountValue === '€40' || discountValue === '35%' || 
                           discountValue === 'bis 40%';
                });
            }

                const newFavorites = new Set(favorites);
                if (newFavorites.has(id)) {
                    newFavorites.delete(id);
                } else {
                    newFavorites.add(id);
                }
                setFavorites(newFavorites);
            };

                    setEmail('');
