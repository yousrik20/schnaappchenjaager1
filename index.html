      function parseDiscount(deal) {
        if (deal.discountPercent !== undefined) return { percent: deal.discountPercent, amount: deal.discountAmount || 0 };
        const t = (deal.title + ' ' + (deal.description || '')).toLowerCase();
        const pm = t.match(/(\d+)%\s*(?:off|rabatt|sparen|nachlass|discount)/i) || t.match(/bis zu\s*(\d+)%/i);
        const am = t.match(/(\d+)\s*€\s*(?:rabatt|nachlass|sparen|cashback|gutschein|bonus)/i) || t.match(/spare\s*(\d+)\s*€/i);
        return { percent: pm ? parseInt(pm[1]) : 0, amount: am ? parseInt(am[1]) : 0 };

         - string "Elektronik,Mode"

      function normCats(cats) {

        const badge = (emoji, label, color) => (

      /* ═══════════════════════════════════════════════

        /* Daten laden: promotions.json (GitHub Actions Output) mit Fallback */
        useEffect(() => {
          async function load() {
            try {
              const r = await fetch('promotions.json');
              if (!r.ok) throw new Error('fetch error');
              const data = await r.json();
              const items = Array.isArray(data)
                ? data
                : (data.promotions || data.deals || data.results || []);
              const enriched = items.map(p => {
                const d = parseDiscount(p);
                return {
                  ...p,
                  discountPercent: p.discountPercent || d.percent,
                  discountAmount:  p.discountAmount  || d.amount,
                  terms:       p.terms || p.conditions || p.term || p.description2 || '',
                  advertiserId:p.advertiserId || p.advertiser_id || p.merchantId || null,
                  advertiser:  p.advertiser || p.advertiserName || p.advertiser_name || p.merchant || '',
                  deeplink:    p.deeplink || p.trackingLink || p.tracking_link || p.url || '#',
                  code:        p.code || p.voucherCode || p.voucher_code || p.coupon || '',
                  type:        p.type || p.promotionType || (p.code || p.voucherCode ? 'voucher' : 'deal'),
                  // Always normalise categories to a comma-separated string
                  categories:  normCats(p.categories || p.category || p.tags || '').join(','),
                };
              });
              setDeals(enriched.length > 0 ? enriched : SAMPLE_DEALS);
            } catch (e) {
              console.log('Falling back to sample data:', e.message);
              setDeals(SAMPLE_DEALS);
            }
            setLoading(false);

          load();

              path = '/#ueber-uns'; break;
            case 'kontakt':

              desc = 'Kontaktiere das schnäppchenjäger1-Team. Fragen, Tipps oder Deal-Einreichungen willkommen.';
              path = '/#kontakt'; break;
            case 'faq':

              path = '/#impressum'; break;
            case 'datenschutz':
              title = 'Datenschutzerklärung | schnäppchenjäger1';
              desc = 'Datenschutzerklärung der Website schnäppchenjäger1.de – DSGVO-konform.';
              path = '/#datenschutz'; break;
            default:
              title = 'schnäppchenjäger1 – Gutscheine & Deals';
              desc = 'Die besten Gutscheine, Deals & Rabattaktionen in Deutschland.';
              path = '/';
          }

          document.title = title;
          setMeta('name', 'description', desc);
          setMeta('property', 'og:title', title);
          setMeta('property', 'og:description', desc);
          setMeta('property', 'og:url', BASE + path);
          setMeta('name', 'twitter:title', title);
          setMeta('name', 'twitter:description', desc);
          setCanonical(BASE + path);

          if (page === 'home') {
            setJsonLd('schema-website', {
              '@context': 'https://schema.org',
              '@type': 'WebSite',
              'name': 'schnäppchenjäger1',
              'url': BASE,
              'potentialAction': {
                '@type': 'SearchAction',
                'target': BASE + '/#search={search_term_string}',
                'query-input': 'required name=search_term_string'
              }
            });
            const activeDeals = deals.filter(d => daysLeft(d.endDate) > 0).slice(0, 20);
            setJsonLd('schema-itemlist', {
              '@context': 'https://schema.org',
              '@type': 'ItemList',
              'name': 'Aktuelle Deals auf schnäppchenjäger1',
              'numberOfItems': activeDeals.length,
              'itemListElement': activeDeals.map((d, i) => ({
                '@type': 'ListItem',
                'position': i + 1,
                'item': {
                  '@type': 'Offer',
                  'name': d.title,
                  'description': d.description,
                  'url': d.deeplink || BASE,
                  'offeredBy': { '@type': 'Organization', 'name': d.advertiser }
                }
              }))
            });
          } else {
            removeJsonLd('schema-website');
            removeJsonLd('schema-itemlist');
          }
          if (page !== 'faq') removeJsonLd('schema-faq');
        }, [route.page, route.param, deals]);

        const categories = useMemo(() => extractCats(deals), [deals]);

        let content;
        if (loading) {
          content = <LoadingSpinner />;
        } else {
          switch (route.page) {
            case 'home': content = <HomePage deals={deals} />; break;
            case 'category': content = <CategoryPage deals={deals} category={route.param} />; break;
            case 'top-deals': content = <TopDealsPage deals={deals} />; break;
            case 'ueber-uns': content = <UberUnsPage />; break;
            case 'kontakt': content = <KontaktPage />; break;
            case 'faq': content = <FAQPage />; break;
            case 'abgelaufene-deals': content = <AbgelaufeneDealsPage deals={deals} />; break;
            case 'impressum': content = <ImpressumPage />; break;
            case 'datenschutz': content = <DatenschutzPage />; break;
            default: content = <HomePage deals={deals} />;
          }
        }

        return (
          <React.Fragment>
            <Navbar route={route} categories={categories} />
            <main className="min-h-screen">{content}</main>
            <Footer />
            <FloatingButton onClick={() => setModalOpen(true)} />
            <DealEinreichenModal open={modalOpen} onClose={() => setModalOpen(false)} />
          </React.Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
