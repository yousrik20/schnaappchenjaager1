<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>schnäppchenjäger1 - Gutscheine und Deals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ── Dynamic deals loader ──────────────────────────────────────────
        // Loads deals.json (written by fetchAwinVouchers.js via GitHub Actions).
        // Falls back gracefully if the file is missing or fetch fails.
        function useDeals() {
            const [deals, setDeals]           = useState([]);
            const [meta, setMeta]             = useState(null);   // lastUpdated, totals
            const [loading, setLoading]       = useState(true);
            const [error, setError]           = useState(null);

            useEffect(() => {
                fetch('./deals.json?t=' + Date.now())   // cache-bust
                    .then(r => {
                        if (!r.ok) throw new Error(`deals.json not found (${r.status})`);
                        return r.json();
                    })
                    .then(data => {
                        setDeals(Array.isArray(data.deals) ? data.deals : []);
                        setMeta({
                            lastUpdated:   data.lastUpdated   ?? null,
                            totalDeals:    data.totalDeals    ?? 0,
                            liveDeals:     data.liveDeals     ?? 0,
                            fallbackDeals: data.fallbackDeals ?? 0,
                        });
                        setLoading(false);
                    })
                    .catch(err => {
                        console.warn('[schnäppchenjäger1] deals.json load failed:', err.message);
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            return { deals, meta, loading, error };
        }

        // ── DealCard Component ────────────────────────────────────────────
        function DealCard({ deal, onFavorite, isFavorite }) {
            const [copied, setCopied] = useState(false);
            const [logoError, setLogoError] = useState(false);

            const handleCopy = () => {
                navigator.clipboard.writeText(deal.code);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 border border-gray-100 flex flex-col h-full">
                    {/* Brand Logo Area */}
                    <div className="bg-gradient-to-br from-indigo-50 to-blue-50 p-6 flex items-center justify-center h-36 relative">
                        {deal.logoUrl && !logoError ? (
                            <img
                                src={deal.logoUrl}
                                alt={`${deal.brandName} Logo`}
                                className="max-h-16 max-w-[160px] object-contain"
                                onError={() => setLogoError(true)}
                            />
                        ) : (
                            <span className="text-5xl">{deal.image}</span>
                        )}
                        {/* AWIN badge */}
                        <span className="absolute top-2 right-2 text-[9px] font-bold text-indigo-400 bg-indigo-50 border border-indigo-100 px-1.5 py-0.5 rounded-full tracking-wider">
                            AWIN
                        </span>
                    </div>

                    <div className="p-5 flex-1 flex flex-col">
                        <div className="flex items-start justify-between mb-3">
                            <div>
                                <h3 className="font-bold text-gray-900 text-base leading-tight">{deal.brandName}</h3>
                                <span className="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full inline-block mt-1">
                                    {deal.category}
                                </span>
                            </div>
                            <button
                                onClick={() => onFavorite(deal.id)}
                                className={`text-xl transition-colors cursor-pointer ml-2 ${isFavorite ? 'text-red-500' : 'text-gray-200 hover:text-red-400'}`}
                            >
                                ❤️
                            </button>
                        </div>

                        <p className="text-sm text-gray-600 mb-4 flex-1 leading-snug">{deal.description}</p>

                        <div className="border-t pt-4">
                            <div className="flex items-baseline gap-2 mb-3">
                                <span className="text-xl font-bold text-indigo-700">{deal.discountValue}</span>
                                <span className="text-xs text-gray-500">Rabatt / Vorteil</span>
                            </div>

                            {deal.code && (
                                <div className="bg-gray-50 p-3 rounded-lg mb-4 border border-dashed border-gray-300">
                                    <p className="text-[10px] uppercase tracking-widest text-gray-400 mb-1.5 font-semibold">Gutscheincode</p>
                                    <button
                                        onClick={handleCopy}
                                        className="w-full flex items-center justify-between bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono font-bold text-gray-900 hover:bg-indigo-50 hover:border-indigo-300 transition-colors cursor-pointer"
                                    >
                                        <span>{deal.code}</span>
                                        <span className="text-base">{copied ? '✅' : '📋'}</span>
                                    </button>
                                </div>
                            )}

                            <a
                                href={deal.dealUrl}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="block w-full text-center bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-semibold py-2.5 rounded-lg transition-all duration-300 text-sm"
                            >
                                Zum Deal →
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        // ── Impressum Component ───────────────────────────────────────────
        function Impressum() {
            return (
                <div className="min-h-screen bg-white">
                    <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                        <h1 className="text-3xl font-bold text-gray-900 mb-8">Impressum</h1>
                        <div className="space-y-8 text-gray-700 leading-relaxed">
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">Angaben gemäß § 5 TMG</h2>
                                <p>schnäppchenjäger1 GmbH<br />Ekenberg Str. 11<br />45307 Essen<br />Deutschland</p>
                            </div>
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">Kontaktinformation</h2>
                                <p>E-Mail: <a href="mailto:info@schnäppchenjäger1.de" className="text-indigo-600 hover:text-indigo-700 font-medium">info@schnäppchenjäger1.de</a><br />Telefon: +49 160 9134 3048<br />Website: <a href="https://schnäppchenjäger1.de" className="text-indigo-600 hover:text-indigo-700 font-medium">schnäppchenjäger1.de</a></p>
                            </div>
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">Vertreter</h2>
                                <p>Geschäftsführer: Salem Youssri</p>
                            </div>
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">Handelsregister</h2>
                                <p>Registergericht: Amtsgericht Essen<br />Handelsregisternummer: HRB 156482<br />USt-IdNr.: DE 347 852 961</p>
                            </div>
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">Haftung für Inhalte</h2>
                                <p>Die Inhalte unserer Seiten wurden mit größter Sorgfalt erstellt. Für die Richtigkeit, Vollständigkeit und Aktualität der Inhalte können wir jedoch keine Gewähr übernehmen.</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ── Datenschutz Component ─────────────────────────────────────────
        function Datenschutz() {
            return (
                <div className="min-h-screen bg-white">
                    <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                        <h1 className="text-3xl font-bold text-gray-900 mb-8">Datenschutzerklärung</h1>
                        <div className="space-y-8 text-gray-700 leading-relaxed">
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">1. Verantwortlicher</h2>
                                <p>schnäppchenjäger1 GmbH<br />Ekenberg Str. 11, 45307 Essen</p>
                            </div>
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">2. Allgemeine Informationen</h2>
                                <p>Wir nehmen den Schutz Ihrer persönlichen Daten sehr ernst.</p>
                            </div>
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">3. Affiliate-Links und Cookies</h2>
                                <p className="mb-3"><strong>Affiliate-Links:</strong> Diese Website enthält Affiliate-Links (u.a. AWIN-Partnerprogramm). Wenn Sie auf einen Affiliate-Link klicken und einen Kauf tätigen, erhalten wir möglicherweise eine Provision.</p>
                                <p><strong>Cookies:</strong> Diese Website verwendet Cookies, einschließlich Tracking-Cookies von Affiliate-Partnern.</p>
                            </div>
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">4. Newsletter</h2>
                                <p>Wenn Sie sich für unseren Newsletter anmelden, speichern wir Ihre E-Mail-Adresse.</p>
                            </div>
                            <div>
                                <h2 className="text-xl font-semibold text-gray-900 mb-3">5. Kontakt</h2>
                                <p>Bei Fragen zur Datenschutzerklärung kontaktieren Sie uns unter:<br />E-Mail: <a href="mailto:datenschutz@schnäppchenjäger1.de" className="text-indigo-600 hover:text-indigo-700 font-medium">datenschutz@schnäppchenjäger1.de</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ── Main App Component ────────────────────────────────────────────
        function App() {
            const [currentPage, setCurrentPage] = useState('home');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Alle');
            const [favorites, setFavorites] = useState(new Set());
            const [email, setEmail] = useState('');
            const [subscribed, setSubscribed] = useState(false);
            const [showTopDeals, setShowTopDeals] = useState(false);

            // ── Live deals from deals.json (written by GitHub Actions) ────
            const { deals: dealsData, meta, loading, error } = useDeals();

            const categories = ['Alle', 'Mode', 'Elektronik', 'Möbel', 'Reisen', 'Beauty', 'Bücher', 'Lebensmittel'];

            let filteredDeals = dealsData.filter(deal => {
                const matchesSearch =
                    deal.brandName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    deal.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    deal.category.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = selectedCategory === 'Alle' || deal.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });

            if (showTopDeals) {
                // Top deals = those with a concrete % or € discount value
                filteredDeals = filteredDeals.filter(deal =>
                    deal.discountValue.includes('%') || deal.discountValue.includes('€')
                );
            }

            const handleFavorite = (id) => {
                const newFavorites = new Set(favorites);
                if (newFavorites.has(id)) newFavorites.delete(id);
                else newFavorites.add(id);
                setFavorites(newFavorites);
            };

            const handleNewsletterSubmit = (e) => {
                e.preventDefault();
                if (email) {
                    setSubscribed(true);
                    setEmail('');
                    setTimeout(() => setSubscribed(false), 3000);
                }
            };

            // ── Sub-pages ────────────────────────────────────────────────
            if (currentPage === 'impressum' || currentPage === 'datenschutz') {
                return (
                    <>
                        <nav className="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                                <button onClick={() => setCurrentPage('home')} className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-600 hover:opacity-80 transition-opacity cursor-pointer">
                                    schnäppchenjäger1
                                </button>
                            </div>
                        </nav>
                        {currentPage === 'impressum' ? <Impressum /> : <Datenschutz />}
                    </>
                );
            }

            // ── Home Page ────────────────────────────────────────────────
            return (
                <div className="min-h-screen bg-gray-50">

                    {/* Navigation */}
                    <nav className="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-600">
                                    schnäppchenjäger1
                                </h1>
                                <div className="hidden md:flex items-center gap-8">
                                    <button
                                        onClick={() => {
                                            setShowTopDeals(false);
                                            setSelectedCategory('Alle');
                                            document.getElementById('categories-section')?.scrollIntoView({ behavior: 'smooth' });
                                        }}
                                        className="text-gray-700 hover:text-indigo-600 font-medium text-sm transition-colors cursor-pointer"
                                    >
                                        Kategorien
                                    </button>
                                    <button
                                        onClick={() => setShowTopDeals(!showTopDeals)}
                                        className={`font-medium text-sm transition-colors cursor-pointer ${showTopDeals ? 'text-indigo-600' : 'text-gray-700 hover:text-indigo-600'}`}
                                    >
                                        🔥 Top-Deals
                                    </button>
                                </div>
                                <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="md:hidden text-gray-700 cursor-pointer text-xl">
                                    {mobileMenuOpen ? '✕' : '☰'}
                                </button>
                            </div>
                            {mobileMenuOpen && (
                                <div className="md:hidden py-4 border-t border-gray-100">
                                    <button
                                        onClick={() => { setShowTopDeals(false); setSelectedCategory('Alle'); setMobileMenuOpen(false); document.getElementById('categories-section')?.scrollIntoView({ behavior: 'smooth' }); }}
                                        className="block w-full text-left px-4 py-2 text-gray-700 hover:text-indigo-600 font-medium cursor-pointer"
                                    >Kategorien</button>
                                    <button
                                        onClick={() => { setShowTopDeals(!showTopDeals); setMobileMenuOpen(false); }}
                                        className="block w-full text-left px-4 py-2 text-gray-700 hover:text-indigo-600 font-medium cursor-pointer"
                                    >🔥 Top-Deals</button>
                                </div>
                            )}
                        </div>
                    </nav>

                    {/* Hero */}
                    <div className="bg-gradient-to-br from-indigo-600 via-blue-600 to-indigo-700 text-white py-16 sm:py-24">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="inline-flex items-center gap-2 bg-white/10 border border-white/20 rounded-full px-4 py-1.5 mb-6 text-sm font-medium">
                                <span>🎯</span>
                                <span>18 AWIN-Partnerprogramme – täglich aktualisiert</span>
                            </div>
                            <h2 className="text-4xl sm:text-5xl font-bold mb-4 leading-tight">
                                Die besten Gutscheine und Rabatte in Deutschland
                            </h2>
                            <p className="text-lg text-indigo-100 mb-8 max-w-2xl">
                                Entdecke täglich neue Deals und Gutscheine von deinen liebsten Marken und spare mit uns Geld!
                            </p>
                            <div className="relative max-w-md">
                                <input
                                    type="text"
                                    placeholder="Nach Marke oder Deal suchen..."
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-12 pr-4 py-3 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-white"
                                />
                                <span className="absolute left-4 top-3.5 text-indigo-300">🔍</span>
                            </div>
                        </div>
                    </div>

                    {/* Stats bar */}
                    <div className="bg-indigo-700 text-white/80 py-2">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-wrap gap-x-6 gap-y-1 text-xs font-medium">
                            <span>✅ {dealsData.length} aktive Deals</span>
                            <span>🏷️ {categories.length - 1} Kategorien</span>
                            <span>🤝 AWIN-Partnerprogramm</span>
                            <span>🇩🇪 Nur deutsche Anbieter</span>
                            {meta?.lastUpdated && (
                                <span className="ml-auto text-white/50">
                                    🕐 Aktualisiert: {new Date(meta.lastUpdated).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })} Uhr
                                </span>
                            )}
                        </div>
                    </div>

                    {/* Loading state */}
                    {loading && (
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24 text-center">
                            <div className="inline-flex flex-col items-center gap-4">
                                <div className="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
                                <p className="text-gray-500 font-medium">Deals werden geladen…</p>
                            </div>
                        </div>
                    )}

                    {/* Error state */}
                    {!loading && error && (
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                            <div className="bg-amber-50 border border-amber-200 rounded-xl p-6 text-center">
                                <p className="text-amber-800 font-semibold mb-1">⚠️ Deals konnten nicht geladen werden</p>
                                <p className="text-amber-700 text-sm">Bitte führen Sie den GitHub Actions Workflow aus, um deals.json zu generieren.</p>
                                <code className="mt-3 inline-block text-xs bg-amber-100 px-3 py-1 rounded text-amber-900">{error}</code>
                            </div>
                        </div>
                    )}

                    {/* Category Filter */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" id="categories-section">
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-lg font-bold text-gray-900">Filter nach Kategorie</h3>
                            {showTopDeals && (
                                <button onClick={() => setShowTopDeals(false)} className="text-sm text-indigo-600 hover:text-indigo-700 font-medium underline cursor-pointer">
                                    ✕ Top-Deals Filter entfernen
                                </button>
                            )}
                        </div>
                        <div className="flex overflow-x-auto gap-2 pb-3">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setSelectedCategory(cat)}
                                    className={`px-4 py-2 rounded-full font-medium whitespace-nowrap text-sm transition-all duration-200 cursor-pointer ${
                                        selectedCategory === cat
                                            ? 'bg-indigo-600 text-white shadow-md'
                                            : 'bg-white text-gray-700 border border-gray-200 hover:border-indigo-300 hover:text-indigo-600'
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Deals Grid */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
                        <div className="mb-16">
                            <h3 className="text-2xl font-bold text-gray-900 mb-8">
                                {showTopDeals ? '🔥 Top-Deals' : selectedCategory === 'Alle' ? 'Alle Deals' : `${selectedCategory}-Deals`}
                                <span className="text-gray-400 text-base font-normal ml-2">({filteredDeals.length})</span>
                            </h3>

                            {filteredDeals.length > 0 ? (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                    {filteredDeals.map(deal => (
                                        <DealCard
                                            key={deal.id}
                                            deal={deal}
                                            onFavorite={handleFavorite}
                                            isFavorite={favorites.has(deal.id)}
                                        />
                                    ))}
                                </div>
                            ) : (
                                <div className="text-center py-16">
                                    <p className="text-gray-500 text-lg">Keine Deals gefunden. Versuchen Sie eine andere Suche.</p>
                                </div>
                            )}
                        </div>

                        {/* Newsletter */}
                        <div className="bg-gradient-to-r from-indigo-50 to-blue-50 rounded-2xl p-8 sm:p-12 border border-indigo-100 mb-16">
                            <h3 className="text-2xl sm:text-3xl font-bold text-gray-900 mb-3">Bleiben Sie informiert!</h3>
                            <p className="text-gray-700 mb-6 max-w-2xl">
                                Abonnieren Sie unseren Newsletter und erhalten Sie täglich die besten Gutscheine und Rabatte direkt in Ihren Posteingang.
                            </p>
                            <form onSubmit={handleNewsletterSubmit} className="flex gap-3 max-w-md">
                                <input
                                    type="email"
                                    placeholder="Ihre E-Mail-Adresse"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                    className="flex-1 px-4 py-3 rounded-lg border border-gray-200 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-600"
                                />
                                <button
                                    type="submit"
                                    className="px-6 py-3 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-semibold rounded-lg transition-all duration-300 cursor-pointer whitespace-nowrap"
                                >
                                    Abonnieren
                                </button>
                            </form>
                            {subscribed && (
                                <p className="mt-3 text-green-700 font-medium">✓ Danke für Ihre Anmeldung!</p>
                            )}
                        </div>
                    </div>

                    {/* Footer */}
                    <footer className="bg-gray-900 text-gray-300">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-8 mb-8">
                                <div>
                                    <h4 className="text-white font-bold text-lg mb-3">schnäppchenjäger1</h4>
                                    <p className="text-sm text-gray-400">Die beste Anlaufstelle für Gutscheine, Rabatte und Deals in Deutschland.</p>
                                    <a href="https://schnäppchenjäger1.de" className="text-indigo-400 hover:text-indigo-300 text-sm font-medium mt-2 inline-block">schnäppchenjäger1.de</a>
                                </div>
                                <div>
                                    <h4 className="text-white font-bold text-lg mb-3">Links</h4>
                                    <button onClick={() => setCurrentPage('impressum')} className="block text-sm hover:text-white transition-colors mb-2 cursor-pointer">Impressum</button>
                                    <button onClick={() => setCurrentPage('datenschutz')} className="block text-sm hover:text-white transition-colors cursor-pointer">Datenschutz</button>
                                </div>
                                <div>
                                    <h4 className="text-white font-bold text-lg mb-3">Partner</h4>
                                    <p className="text-sm text-gray-400">Diese Website ist Mitglied im AWIN Affiliate-Netzwerk. Alle Deals sind über AWIN-Partnerprogramme verfügbar.</p>
                                </div>
                            </div>
                            <div className="border-t border-gray-800 pt-8">
                                <p className="text-xs text-center text-gray-500">
                                    © 2026 schnäppchenjäger1. Alle Rechte vorbehalten. |
                                    <a href="https://schnäppchenjäger1.de" className="text-indigo-400 hover:text-indigo-300 ml-1">schnäppchenjäger1.de</a> |
                                    Diese Website enthält Affiliate-Links. Bei Käufen über unsere Links erhalten wir ggf. eine Provision.
                                </p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
