# .github/workflows/fetch-promotions.yml
# ─────────────────────────────────────────────────────────────────────────────
# Runs fetchAwinVouchers.js every day at 06:00 UTC, commits the updated
# deals.json back to the repository, and triggers a fresh deployment.
#
# Required GitHub repository secrets (Settings → Secrets → Actions):
#   AWIN_API_TOKEN      – Publisher API OAuth token from AWIN UI
#   AWIN_PUBLISHER_ID   – Your numeric AWIN Publisher ID
#
# Optional: if you deploy to GitHub Pages, enable Pages in repo settings
# (Source: Deploy from branch → main / root) and the updated deals.json
# will be live automatically after each run.
# ─────────────────────────────────────────────────────────────────────────────

name: Fetch AWIN Promotions

on:
  # ── Scheduled: every day at 06:00 UTC ──────────────────────────────────────
  schedule:
    - cron: '0 6 * * *'

  # ── Allow manual trigger from the Actions tab ───────────────────────────────
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: boolean

# Only one run at a time – cancels any in-progress run on the same branch
concurrency:
  group: fetch-promotions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-and-commit:
    name: Fetch promotions & update deals.json
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write   # needed to push the updated deals.json

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Set up Node.js ────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies (none needed – script uses built-in fetch) ───
      #    Keep this step so future npm deps are handled automatically.
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci --omit=dev
          else
            echo "No package.json found – skipping npm install"
          fi

      # ── 4. Run the fetcher ───────────────────────────────────────────────────
      - name: Fetch AWIN promotions
        env:
          AWIN_API_TOKEN:    ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          NODE_OPTIONS:      '--experimental-vm-modules'
        run: |
          echo "▶ Running fetchAwinVouchers.js …"
          node fetchAwinVouchers.js
          echo "✅ Script completed"

      # ── 5. Show what changed ─────────────────────────────────────────────────
      - name: Show diff
        run: |
          if git diff --quiet deals.json; then
            echo "ℹ️  No changes in deals.json – nothing to commit"
          else
            echo "📋 Changes detected in deals.json:"
            git diff --stat deals.json
          fi

      # ── 6. Commit & push if deals.json changed ───────────────────────────────
      - name: Commit updated deals.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet deals.json; then
            echo "ℹ️  deals.json unchanged – skipping commit"
            exit 0
          fi

          git add deals.json
          git commit -m "chore(deals): auto-update from AWIN API [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
          echo "🚀 deals.json pushed to repository"

      # ── 7. Summary ───────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## 🎯 AWIN Promotion Fetch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f deals.json ]; then
            TOTAL=$(node -e "const d=require('./deals.json'); console.log(d.totalDeals)")
            LIVE=$(node  -e "const d=require('./deals.json'); console.log(d.liveDeals)")
            FB=$(node    -e "const d=require('./deals.json'); console.log(d.fallbackDeals)")
            UPDATED=$(node -e "const d=require('./deals.json'); console.log(d.lastUpdated)")

            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🕐 Last updated | \`$UPDATED\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Total deals  | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Live (AWIN)  | $LIVE  |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚙️ Fallback     | $FB    |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ deals.json was not generated." >> $GITHUB_STEP_SUMMARY
          fi
