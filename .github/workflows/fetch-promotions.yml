name: Fetch Awin Promotions

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fetch script
        env:
          AWIN_API_TOKEN:    ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: "2851329"
          AWIN_REGIONS:      "DE,AT"
        run: node scripts/fetch-awin.js

      - name: Commit and push promotions.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add promotions.json
          # Only commit if there are actual changes — exit 0 if nothing changed (not exit 1)
          git diff --cached --quiet && echo "No changes to promotions.json" || git commit -m "chore: update promotions.json [skip ci]"
          git push
