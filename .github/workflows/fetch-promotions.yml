name: Fetch Awin Promotions

on:
  schedule:
    - cron: "0 */6 * * *"   # alle 6 Stunden
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force commit even if no changes"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["promotions.json"]

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch Awin Programmes + Promotions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── Kernskript ausführen (auto-discovery + promotions) ────────────────
      - name: Run fetch-awin.js
        env:
          AWIN_TOKEN:          ${{ secrets.AWIN_TOKEN }}
          AWIN_PUBLISHER_ID:   "2851329"
          AWIN_REGION:         "DE"
          # ← Keine hardcodierten IDs mehr — werden automatisch aus
          #   der Programmes API ermittelt (alle zugelassenen Advertiser)
        run: node scripts/fetch-awin.js

      # ── Validierung ───────────────────────────────────────────────────────
      - name: Validate promotions.json
        run: |
          node - << 'EOF'
          const d = require("./promotions.json");

          // Partner-Zähler
          const partners   = (d.programmes || []).length;
          const promotions = (d.promotions  || []).length;
          console.log(`\n📊 Validierung`);
          console.log(`  Partner    : ${partners}`);
          console.log(`  Promotions : ${promotions}`);
          console.log(`  Stand      : ${d.fetchedAt}`);

          // Link-Audit
          const broken = (d.promotions||[]).filter(
            p => !p.deeplink?.startsWith("https://")
          );
          if (broken.length) {
            console.warn(`  ⚠️  ${broken.length} defekte Links`);
          } else {
            console.log(`  ✅ Alle Links gültig`);
          }

          // Abbruch wenn 0 Partner gefunden
          if (partners < 1) {
            console.error("❌ Keine Partner — AWIN_TOKEN prüfen!");
            process.exit(1);
          }

          // Aufschlüsselung nach Advertiser
          const g = {};
          (d.promotions||[]).forEach(p => { g[p.advertiser]=(g[p.advertiser]||0)+1; });
          console.log("\n  Nach Advertiser:");
          Object.entries(g).sort((a,b)=>b[1]-a[1])
            .forEach(([k,v]) => console.log(`    ${k.padEnd(36)} ${v}`));
          EOF

      # ── Commit (nur bei Änderungen) ────────────────────────────────────────
      - name: Commit promotions.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add promotions.json
          if git diff --staged --quiet && [ "${{ github.event.inputs.force_update }}" != "true" ]; then
            echo "Keine Änderungen – kein Commit nötig."
          else
            TS=$(date -u "+%d.%m.%Y %H:%M UTC")
            P=$(node -e "const d=require('./promotions.json');console.log(d.programmes?.length||0)")
            V=$(node -e "const d=require('./promotions.json');console.log(d.count||0)")
            git commit -m "chore: Awin update — ${P} Partner, ${V} Deals @ ${TS} [skip ci]"
            git push
            echo "✅ Committed und gepusht."
          fi

      # ── GitHub Actions Summary ─────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          node -e "
            try {
              const d = require('./promotions.json');
              let md = '## 🏷️ Awin Update\n\n';
              md += '| | |\n|---|---|\n';
              md += '| Stand | ' + d.fetchedAt + ' |\n';
              md += '| Partner | **' + (d.programmes?.length||0) + '** |\n';
              md += '| Aktive Deals | **' + d.count + '** |\n\n';
              md += '### Partner\n\n| Name | Deals |\n|---|---|\n';
              const g={};
              (d.promotions||[]).forEach(p=>{g[p.advertiser]=(g[p.advertiser]||0)+1;});
              (d.programmes||[]).forEach(p=>{
                md += '| ' + p.name + ' | ' + (g[p.name]||0) + ' |\n';
              });
              process.stdout.write(md);
            } catch(e) { process.stdout.write('Fehler: '+e.message); }
          " >> \$GITHUB_STEP_SUMMARY
