name: Fetch Awin Promotions

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run fetch script
        env:
          AWIN_API_TOKEN:    ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: "2851329"
          AWIN_REGIONS:      "DE,AT"
        run: node scripts/fetch-awin.js

      - name: Commit and push promotions.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add promotions.json
          git diff --cached --quiet \
            && echo "promotions.json unchanged — skipping commit" \
            || (git commit -m "chore: update promotions.json [skip ci]" && git push)
