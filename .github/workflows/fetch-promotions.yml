name: Fetch Awin Promotions

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify secret is set
        run: |
          if [ -z "$AWIN_API_TOKEN" ]; then
            echo "❌ ERROR: AWIN_API_TOKEN secret is NOT set or is empty!"
            echo "Go to: Settings → Secrets → Actions → New repository secret"
            echo "Name: AWIN_API_TOKEN  Value: your Awin API token"
            exit 1
          else
            echo "✅ AWIN_API_TOKEN is set (length: ${#AWIN_API_TOKEN})"
          fi
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}

      - name: Run fetch script
        env:
          AWIN_API_TOKEN:    ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: "2851329"
          AWIN_REGIONS:      "DE,AT"
        run: node scripts/fetch-awin.js

      - name: Show promotions.json summary
        run: |
          if [ -f promotions.json ]; then
            echo "✅ promotions.json exists"
            echo "File size: $(wc -c < promotions.json) bytes"
            echo "Total offers: $(node -e "const d=require('./promotions.json'); console.log(d.total || d.promotions?.length || 0)")"
          else
            echo "❌ promotions.json was NOT created!"
            exit 1
          fi

      - name: Commit and push promotions.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add promotions.json
          git diff --cached --quiet \
            && echo "ℹ️  promotions.json unchanged — skipping commit" \
            || (git commit -m "chore: update promotions.json [skip ci]" && git push)
